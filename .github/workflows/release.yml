name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC) requires npm 11.5.1+; Node 20 bundles
      # an older npm by default.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # On every push to main: if there are pending changesets, opens/updates
      # a "Version Packages" PR. Once that PR is merged (which consumes the
      # changesets and bumps package.json), this step publishes to npm
      # instead. Either way, nothing publishes on an ordinary push.
      #
      # Publishing uses npm Trusted Publishing (OIDC) — configured on
      # npmjs.com against this exact repo/workflow — instead of a stored
      # token. No NPM_TOKEN/NODE_AUTH_TOKEN here on purpose: setting either
      # makes changesets/action prefer classic token auth over OIDC.
      # `id-token: write` above is what makes the OIDC token available.
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
