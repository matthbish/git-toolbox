name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # On every push to main: if there are pending changesets, opens/updates
      # a "Version Packages" PR. Once that PR is merged (which consumes the
      # changesets and bumps package.json), this step publishes to npm
      # instead. Either way, nothing publishes on an ordinary push.
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NODE_AUTH_TOKEN is what npm's own .npmrc (wired up by setup-node)
          # actually authenticates with. NPM_TOKEN is also required: changesets/action
          # checks for that exact variable name to decide whether to use classic
          # token auth or attempt OIDC "trusted publishing" instead — without it,
          # it silently prefers OIDC and fails, since no trusted publisher is
          # configured on npmjs.com for this package.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
